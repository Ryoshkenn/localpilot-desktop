name: LocalPilotDesktop
options:
  bundleIdPrefix: com.localpilot
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # A real identity keeps the app's designated requirement stable across
    # rebuilds. Ad-hoc signing ties macOS privacy grants (Accessibility,
    # Screen Recording) to one binary's hash, so every rebuild lost them.
    # The test bundle must share the team to load into the host app.
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: WJZ957T3P9
    PRODUCT_NAME: LocalPilotDesktop
targets:
  LocalPilotDesktop:
    type: application
    platform: macOS
    sources:
      - path: apps/macos/Sources
      - path: core/agent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localpilot.desktop
        INFOPLIST_FILE: apps/macos/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Gray, so system controls (switches, focus rings, links) stay monochrome.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: apps/macos/LocalPilotDesktop.entitlements
    scheme:
      testTargets:
        - LocalPilotDesktopTests
  LocalPilotDesktopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: apps/macos/Tests
    dependencies:
      - target: LocalPilotDesktop
    hostApplication: LocalPilotDesktop
    settings:
      base:
        PRODUCT_NAME: LocalPilotDesktopTests
        PRODUCT_MODULE_NAME: LocalPilotDesktopTests
        PRODUCT_BUNDLE_IDENTIFIER: com.localpilot.desktop.tests
        GENERATE_INFOPLIST_FILE: YES
